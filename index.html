<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e; --line: rgba(255,255,255,.12);
    --text: #f5f5f7; --muted: rgba(245,245,247,.55);
    --glass: rgba(255,255,255,.14); --glass-edge: rgba(255,255,255,.85);
    --tw: 254px; --th: 152px; --gap: 40px; --radius: 22px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  html { height: 100%; overflow: hidden; background: var(--bg); }
  html.bg-gradient { background-image: linear-gradient(160deg, #0b1020 0%, #1a1330 60%, #2a1630 100%); }
  html.bg-navy { background: #0a1424; }
  html, body { margin: 0; color: var(--text); }
  body { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
    font-family: Outfit, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif; }

  /* ---- верх: слева кнопки, справа часы */
  #top { position: absolute; top: 56px; left: 96px; right: 96px; height: 160px; }
  #pills { position: absolute; left: 0; top: 18px; }
  .pill { display: inline-block; margin-right: 18px; padding: 16px 30px; border-radius: 40px; background: var(--surface-2);
    font-size: 28px; color: var(--muted); transition: background .15s, color .15s, transform .15s var(--ease); }
  .pill.focus { background: var(--text); color: #000; transform: scale(1.06); }
  #clock { position: absolute; right: 0; top: 0; text-align: right; }
  #time { font-size: 120px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
  #date { font-size: 30px; font-weight: 300; color: var(--muted); margin-top: 8px; }

  /* ---- контент: заголовок, док, сетка. Прокручивается целиком */
  #viewport { position: absolute; top: 250px; left: 0; right: 0; bottom: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
  #content { position: absolute; left: 96px; right: 96px; top: 0; transition: transform .35s var(--ease); }
  #title { transition: opacity .2s; height: 90px; font-size: 52px; font-weight: 300; padding-left: 6px; white-space: nowrap; overflow: hidden; }
  #dock { position: relative; padding: 34px 30px; margin: 0 -30px; border-radius: 34px; background: var(--surface); min-height: var(--th); }
  #grid { position: relative; margin-top: 56px; }
  .tile { position: relative; display: inline-block; vertical-align: top; width: var(--tw); margin-right: var(--gap); }
  #dock .tile, #grid .tile { margin-bottom: 0; }
  #grid .tile { margin-bottom: 30px; }
  .tile.eol { margin-right: 0; }
  .card { position: relative; width: var(--tw); height: var(--th); border-radius: var(--radius); overflow: hidden;
    display: block; color: #fff; text-align: center; line-height: var(--th); font-size: 64px; font-weight: 600;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  .card img { position: absolute; left: 50%; top: 50%; }
  .card img.logo { height: 46%; max-width: 70%; transform: translate(-50%, -50%); }
  .card img.badge { width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 22px; }
  .card .glyph { display: none; font-weight: 600; }
  .card.noimg img { display: none; }
  .card.noimg .glyph { display: inline; }
  .card .sub { position: absolute; left: 0; right: 0; bottom: 12px; line-height: 1; font-size: 20px; font-weight: 400; opacity: .8; }
  .label { margin-top: 12px; font-size: 24px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 30px; }
  #dock .label { display: none; }
  .tile.focus .card { transform: scale(1.08); }
  .tile.focus .label { color: var(--text); }
  .tile.moving .card { transform: scale(1.08) rotate(-2deg); }
  /* стеклянный фокус: один слой, ездит поверх плитки в фокусе */
  #glass { position: absolute; left: 0; top: 0; border-radius: var(--radius); pointer-events: none; z-index: 2;
    width: var(--tw); height: var(--th); background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,.04) 55%);
    box-shadow: inset 0 0 0 3px var(--glass-edge); transform-origin: 50% 50%; opacity: 0;
    transition: transform .22s var(--ease), opacity .15s; }
  .moving-mode #glass { box-shadow: inset 0 0 0 4px #ffd60a; }
  .empty { color: var(--muted); font-size: 28px; padding: 40px 0; }

  /* ---- модальные окна (настройки, меню, форма) */
  #modal { display: none; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: rgba(0,0,0,.6); z-index: 10; }
  #sheet { position: absolute; right: 60px; top: 60px; bottom: 60px; width: 760px; background: var(--surface); border-radius: 36px;
    padding: 44px 0; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  #sheet.left { right: auto; left: 96px; top: 150px; bottom: auto; max-height: 820px; width: 560px; }
  #sheet h2 { margin: 0 48px 24px; font-size: 40px; font-weight: 400; }
  #items { position: relative; transition: transform .25s var(--ease); }
  .item { margin: 0 24px; padding: 20px 24px; border-radius: 18px; font-size: 30px; position: relative; color: var(--text); }
  .item .val { position: absolute; right: 24px; top: 20px; color: var(--muted); }
  .item.focus { background: var(--text); color: #000; }
  .item.focus .val { color: rgba(0,0,0,.6); }
  .item.sep { margin-top: 18px; }
  .item .hint { display: block; font-size: 20px; color: var(--muted); margin-top: 4px; }
  .item.focus .hint { color: rgba(0,0,0,.55); }
  .item input { width: 100%; box-sizing: border-box; margin-top: 10px; font: 28px Outfit, Arial, sans-serif; padding: 12px 16px;
    border-radius: 12px; border: 2px solid var(--line); background: #000; color: var(--text); }
  .item.focus input { border-color: #000; }
  .swatch { display: inline-block; width: 34px; height: 34px; border-radius: 10px; margin-left: 10px; vertical-align: middle; border: 2px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .item.focus .swatch.on { border-color: #000; }

  #sheet.wide { left: 60px; right: 60px; top: 40px; bottom: 40px; width: auto; }
  #sheet.wide #items { position: static; transform: none !important; } /* #diag меряется от #sheet */
  #diag { position: absolute; left: 48px; right: 48px; top: 210px; bottom: 30px; overflow: hidden; color: var(--muted); }
  #diag-in { transition: transform .2s var(--ease); }
  .fns-title { font-size: 24px; color: var(--text); margin-bottom: 10px; }
  .fns { -webkit-column-count: 4; column-count: 4; -webkit-column-gap: 24px; column-gap: 24px; font: 19px/1.45 Menlo, monospace; color: var(--text); }
  .fn { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #diag pre { white-space: pre-wrap; font: 19px/1.4 Menlo, monospace; margin: 20px 0 0; }
  #toast { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: var(--surface-2); z-index: 20;
    border-radius: 40px; padding: 18px 40px; font-size: 28px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
</style>
</head>
<body>
<header id="top">
  <nav id="pills"><span class="pill" data-top="0">Входы</span><span class="pill" data-top="1">Настройки</span></nav>
  <div id="clock"><div id="time">--:--</div><div id="date"></div></div>
</header>
<main id="viewport">
  <div id="content">
    <div id="title"></div>
    <section id="dock"></section>
    <section id="grid"></section>
    <div id="glass"></div>
  </div>
</main>
<div id="modal"><div id="sheet"><h2 id="sheet-title"></h2><div id="items"></div></div></div>
<div id="toast"></div>
<script src="tv.js"></script>
<script src="app.js"></script>
</body>
</html>
